<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gmail Live Monitor: Inbox & Spam</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; padding: 1.5rem; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 1.5rem;
    }
    
    .title-group h1 { font-size: 1.5rem; font-weight: 700; color: #f8fafc; }
    .title-group p { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
    
    .controls { display: flex; align-items: center; gap: 1rem; }
    
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 9999px;
      color: #94a3b8;
    }
    
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }
    
    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 7px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .btn.active { background: #10b981; }

    /* Dual Feed Grid */
    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 820px) {
      .grid-layout { grid-template-columns: 1fr; }
    }

    .feed-column {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #1e293b;
    }

    .column-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .column-title.inbox { color: #60a5fa; }
    .column-title.spam { color: #f87171; }

    .counter-badge {
      font-size: 0.75rem;
      background: #1e293b;
      padding: 2px 8px;
      border-radius: 999px;
      color: #94a3b8;
    }

    .mail-feed {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 200px;
    }

    .mail-card {
      background: #131d31;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      animation: slideIn 0.3s ease-out;
    }

    .mail-card.inbox { border-left: 4px solid #3b82f6; }
    .mail-card.spam { border-left: 4px solid #ef4444; background: #1a1520; }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .mail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
    }
    
    .sender { font-weight: 600; color: #cbd5e1; }
    .inbox .sender { color: #93c5fd; }
    .spam .sender { color: #fca5a5; }
    .date { color: #64748b; font-size: 0.75rem; }
    .subject { font-size: 0.95rem; font-weight: 600; color: #f8fafc; margin-bottom: 0.35rem; }
    .snippet { font-size: 0.85rem; color: #94a3b8; line-height: 1.4; word-break: break-word; }
    
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #64748b;
      font-size: 0.85rem;
      border: 1px dashed #1e293b;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title-group">
        <h1>Gmail Live Monitor</h1>
        <p>Account: <strong>agarwalkartik311</strong> &bull; Poll interval: <strong>5s</strong></p>
      </div>
      <div class="controls">
        <button class="btn" id="audioBtn" onclick="toggleAudio()">Enable Audio</button>
        <div class="status-badge">
          <div class="pulse-dot"></div>
          <span id="pollStatus">Connecting...</span>
        </div>
      </div>
    </div>

    <div class="grid-layout">
      <!-- Inbox Column -->
      <div class="feed-column">
        <div class="column-header">
          <span class="column-title inbox">&#9993; Inbox</span>
          <span class="counter-badge" id="inboxCount">0 new</span>
        </div>
        <div id="inboxFeed" class="mail-feed">
          <div class="empty-state" id="inboxPlaceholder">Listening for inbox emails...</div>
        </div>
      </div>

      <!-- Spam Column -->
      <div class="feed-column">
        <div class="column-header">
          <span class="column-title spam">&#9888; Spam</span>
          <span class="counter-badge" id="spamCount">0 new</span>
        </div>
        <div id="spamFeed" class="mail-feed">
          <div class="empty-state" id="spamPlaceholder">Listening for spam emails...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      clientId: "993990204222-qcknpbirqoh9mp2951qfvm4vv7imk087.apps.googleusercontent.com",
      clientSecret: "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",
      refreshToken: "1//0gnp_s8NW7XsUCgYIARAAGBASNwF-L9IramoWeIw45k3vawiTQkZDmiwbS2U_kHMZyzUp4v-3ezXeiPa8_fN-e8JbxcZtxKlerTU"
    };

    let accessToken = null;
    let tokenExpiryTime = 0;
    const knownIds = new Set();
    let initialSyncComplete = false;
    let audioCtx = null;
    let inboxCount = 0;
    let spamCount = 0;

    // Dual-mode audio chime: distinct tones for inbox vs spam
    function playChime(isSpam = false) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = isSpam ? 'sawtooth' : 'sine';

      if (isSpam) {
        // Lower descending alert tone for spam: G4 to C4
        osc.frequency.setValueAtTime(392.00, now);
        osc.frequency.setValueAtTime(261.63, now + 0.15);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      } else {
        // High ascending chime for inbox: E5 to B5
        osc.frequency.setValueAtTime(659.25, now);
        osc.frequency.setValueAtTime(987.77, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
      }

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + (isSpam ? 0.5 : 0.7));
    }

    function toggleAudio() {
      const btn = document.getElementById('audioBtn');
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        btn.textContent = "Audio Enabled";
        btn.classList.add('active');
        playChime(false);
      }
    }

    async function getValidAccessToken() {
      const now = Date.now();
      if (accessToken && now < tokenExpiryTime) {
        return accessToken;
      }

      const res = await fetch("https://oauth2.googleapis.com/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          client_id: CONFIG.clientId,
          client_secret: CONFIG.clientSecret,
          refresh_token: CONFIG.refreshToken,
          grant_type: "refresh_token"
        })
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error_description || "Authentication failed");
      }

      const data = await res.json();
      accessToken = data.access_token;
      tokenExpiryTime = now + (data.expires_in - 120) * 1000;
      return accessToken;
    }

    async function fetchMessageDetails(id, token) {
      const res = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      const headers = data.payload?.headers || [];
      const getVal = (name) => headers.find(h => h.name.toLowerCase() === name.toLowerCase())?.value || "";

      return {
        id: data.id,
        from: getVal("From"),
        subject: getVal("Subject") || "(No Subject)",
        date: getVal("Date"),
        snippet: data.snippet || ""
      };
    }

    async function fetchQuery(query, token) {
      const res = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${encodeURIComponent(query)}&maxResults=10`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      return data.messages || [];
    }

    async function checkInbox() {
      const statusEl = document.getElementById("pollStatus");
      try {
        const token = await getValidAccessToken();
        statusEl.textContent = "Active";

        // Query both inbox and spam concurrently
        const [inboxMessages, spamMessages] = await Promise.all([
          fetchQuery("is:inbox is:unread", token),
          fetchQuery("in:spam", token)
        ]);

        const newInbox = inboxMessages.filter(m => !knownIds.has(m.id));
        const newSpam = spamMessages.filter(m => !knownIds.has(m.id));

        if (!initialSyncComplete) {
          inboxMessages.forEach(m => knownIds.add(m.id));
          spamMessages.forEach(m => knownIds.add(m.id));
          initialSyncComplete = true;

          document.getElementById("inboxPlaceholder").textContent = "Inbox monitored. Waiting for incoming mail...";
          document.getElementById("spamPlaceholder").textContent = "Spam monitored. Waiting for incoming spam...";
          return;
        }

        if (newInbox.length > 0) {
          playChime(false);
          for (const msg of newInbox) {
            knownIds.add(msg.id);
            const details = await fetchMessageDetails(msg.id, token);
            renderEmail(details, 'inbox');
          }
        }

        if (newSpam.length > 0) {
          // Play spam tone only if inbox hasn't already chimed this tick
          if (newInbox.length === 0) playChime(true);
          for (const msg of newSpam) {
            knownIds.add(msg.id);
            const details = await fetchMessageDetails(msg.id, token);
            renderEmail(details, 'spam');
          }
        }
      } catch (err) {
        statusEl.textContent = "Error";
        console.error("Polling error:", err);
      }
    }

    function renderEmail(mail, category) {
      const feedId = category === 'spam' ? 'spamFeed' : 'inboxFeed';
      const placeholderId = category === 'spam' ? 'spamPlaceholder' : 'inboxPlaceholder';
      const countId = category === 'spam' ? 'spamCount' : 'inboxCount';

      const feed = document.getElementById(feedId);
      const placeholder = document.getElementById(placeholderId);
      if (placeholder) placeholder.remove();

      if (category === 'spam') {
        spamCount++;
        document.getElementById(countId).textContent = `${spamCount} new`;
      } else {
        inboxCount++;
        document.getElementById(countId).textContent = `${inboxCount} new`;
      }

      const card = document.createElement("div");
      card.className = `mail-card ${category}`;
      card.innerHTML = `
        <div class="mail-header">
          <span class="sender">${escapeHtml(mail.from)}</span>
          <span class="date">${escapeHtml(mail.date)}</span>
        </div>
        <div class="subject">${escapeHtml(mail.subject)}</div>
        <div class="snippet">${escapeHtml(mail.snippet)}</div>
      `;

      feed.prepend(card);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    checkInbox();
    setInterval(checkInbox, 5000);
  </script>
</body>
</html>
