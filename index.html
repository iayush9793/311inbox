<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inbox Live Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; padding: 2rem; }
    
    .container { max-width: 900px; margin: 0 auto; }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 1.5rem;
    }
    
    .title-group h1 { font-size: 1.5rem; font-weight: 700; color: #f8fafc; }
    .title-group p { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
    
    .controls { display: flex; align-items: center; gap: 1rem; }
    
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 9999px;
      color: #94a3b8;
    }
    
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }
    
    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 7px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .btn.active { background: #10b981; }

    .mail-feed { display: flex; flex-direction: column; gap: 0.75rem; }
    
    .mail-card {
      background: #131d31;
      border: 1px solid #1e293b;
      border-left: 4px solid #3b82f6;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .mail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
    }
    
    .sender { font-weight: 600; color: #93c5fd; }
    .date { color: #64748b; font-size: 0.75rem; }
    .subject { font-size: 1rem; font-weight: 600; color: #f8fafc; margin-bottom: 0.35rem; }
    .snippet { font-size: 0.85rem; color: #94a3b8; line-height: 1.4; }
    
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #64748b;
      font-size: 0.95rem;
      border: 1px dashed #1e293b;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title-group">
        <h1>Gmail Inbox Monitor</h1>
        <p>Account: <strong>agarwalkartik311</strong> &bull; Poll interval: <strong>5s</strong></p>
      </div>
      <div class="controls">
        <button class="btn" id="audioBtn" onclick="toggleAudio()">Enable Audio</button>
        <div class="status-badge">
          <div class="pulse-dot"></div>
          <span id="pollStatus">Connecting...</span>
        </div>
      </div>
    </div>

    <div id="feed" class="mail-feed">
      <div class="empty-state" id="placeholder">Listening for incoming emails...</div>
    </div>
  </div>

  <script>
    const CONFIG = {
      clientId: "993990204222-qcknpbirqoh9mp2951qfvm4vv7imk087.apps.googleusercontent.com",
      clientSecret: "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",
      refreshToken: "1//0gnp_s8NW7XsUCgYIARAAGBASNwF-L9IramoWeIw45k3vawiTQkZDmiwbS2U_kHMZyzUp4v-3ezXeiPa8_fN-e8JbxcZtxKlerTU"
    };

    let accessToken = null;
    let tokenExpiryTime = 0;
    const knownIds = new Set();
    let initialSyncComplete = false;
    let audioCtx = null;

    // Web Audio Synthesizer (Generates clean two-tone chime without external files)
    function playChime() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      // Pitch ramp: E5 (659.25Hz) to B5 (987.77Hz)
      osc.frequency.setValueAtTime(659.25, now);
      osc.frequency.setValueAtTime(987.77, now + 0.1);

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.7);
    }

    // Browsers block autoplay until user clicks once
    function toggleAudio() {
      const btn = document.getElementById('audioBtn');
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        btn.textContent = "Audio Enabled";
        btn.classList.add('active');
        playChime();
      }
    }

    // Refresh OAuth Access Token via Google OAuth endpoint
    async function getValidAccessToken() {
      const now = Date.now();
      if (accessToken && now < tokenExpiryTime) {
        return accessToken;
      }

      const res = await fetch("https://oauth2.googleapis.com/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          client_id: CONFIG.clientId,
          client_secret: CONFIG.clientSecret,
          refresh_token: CONFIG.refreshToken,
          grant_type: "refresh_token"
        })
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error_description || "Authentication failed");
      }

      const data = await res.json();
      accessToken = data.access_token;
      tokenExpiryTime = now + (data.expires_in - 120) * 1000;
      return accessToken;
    }

    // Fetch individual message details
    async function fetchMessageDetails(id, token) {
      const res = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      const headers = data.payload?.headers || [];
      const getVal = (name) => headers.find(h => h.name.toLowerCase() === name.toLowerCase())?.value || "";

      return {
        id: data.id,
        from: getVal("From"),
        subject: getVal("Subject") || "(No Subject)",
        date: getVal("Date"),
        snippet: data.snippet || ""
      };
    }

    // Main poll routine
    async function checkInbox() {
      const statusEl = document.getElementById("pollStatus");
      try {
        const token = await getValidAccessToken();
        statusEl.textContent = "Active";

        // Query only unread inbox messages
        const listRes = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages?q=is:inbox is:unread&maxResults=10", {
          headers: { Authorization: `Bearer ${token}` }
        });

        const listData = await listRes.json();
        const messages = listData.messages || [];

        // Identify completely new IDs not yet tracked
        const newMessages = messages.filter(m => !knownIds.has(m.id));

        if (!initialSyncComplete) {
          // First load: record baseline without buzzing on stale unreads
          messages.forEach(m => knownIds.add(m.id));
          initialSyncComplete = true;
          document.getElementById("placeholder").textContent = "Inbox monitored. Waiting for incoming mail...";
          return;
        }

        if (newMessages.length > 0) {
          playChime();

          for (const msg of newMessages) {
            knownIds.add(msg.id);
            const details = await fetchMessageDetails(msg.id, token);
            renderEmail(details);
          }
        }
      } catch (err) {
        statusEl.textContent = "Error";
        console.error("Polling error:", err);
      }
    }

    function renderEmail(mail) {
      const feed = document.getElementById("feed");
      const placeholder = document.getElementById("placeholder");
      if (placeholder) placeholder.remove();

      const card = document.createElement("div");
      card.className = "mail-card";
      card.innerHTML = `
        <div class="mail-header">
          <span class="sender">${escapeHtml(mail.from)}</span>
          <span class="date">${escapeHtml(mail.date)}</span>
        </div>
        <div class="subject">${escapeHtml(mail.subject)}</div>
        <div class="snippet">${escapeHtml(mail.snippet)}</div>
      `;

      feed.prepend(card);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    // Start cycle immediately, then every 5 seconds
    checkInbox();
    setInterval(checkInbox, 5000);
  </script>
</body>
</html>
